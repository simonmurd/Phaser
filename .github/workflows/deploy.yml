name: Deploy JRPG Studio to GitHub Pages

on:
  push:
    branches: ["main"] # Berjalan otomatis setiap ada push ke branch main

  # Mengizinkan jalankan manual dari tab Actions
  workflow_dispatch:

# Mengatur izin GITHUB_TOKEN untuk melakukan deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya ada satu deployment berjalan dalam satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun # Menggunakan Bun sesuai lockfile bun.lock Anda
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
